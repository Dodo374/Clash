SelectHT: &SelectHT {type: select, proxies: [港台自动, 默认代理, 香港自动, 狮城自动, 日本自动, 韩国自动, 美国自动, 台湾自动, 欧盟自动, 其他节点, 全球手动, 直接连接]}

